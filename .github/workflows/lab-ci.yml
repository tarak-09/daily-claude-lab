# Checks for the lab itself: unit tests for the planner and the publish gates,
# shellcheck, and actionlint over every workflow. The daily ledger commits only
# touch RUNS.md, so they do not trigger this.

name: lab-ci

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "prompts/**", ".github/workflows/**"]
  pull_request:
    paths: ["scripts/**", "tests/**", "prompts/**", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: shellcheck
        run: shellcheck scripts/*.sh

      - name: actionlint
        run: |
          set -euo pipefail
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
