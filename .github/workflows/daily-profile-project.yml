# Daily engineering lab, pull-request mode.
#
# Once a day this improves ONE existing portfolio project (a repository owned
# by the token's account that carries the TOPIC below) by opening a pull
# request, or revises one of its own open pull requests after you comment on
# it or its checks fail. It never creates repositories and never pushes to a
# default branch. Every commit is authored and committed as you, with no
# co-author trailers, so your account is the only contributor GitHub lists.
#
# Four jobs, each on a fresh VM, so the GitHub token never shares a machine
# with the model or with the dependencies and tests it runs:
#
#   plan     GitHub token, no model. Reads the portfolio and picks today's
#            action: revise an open lab PR, improve the next repo in
#            rotation, or skip. (scripts/lab_state.py)
#   work     No GitHub token. Gemini audits the repo and implements one
#            change in an anonymous clone; the job commits it as you,
#            re-runs the tests itself, and hands over a git bundle.
#   publish  GitHub token, no model, no project code. Re-checks the commit
#            (scripts/verify_change.sh), then opens the PR or pushes to the
#            PR branch and replies.
#   ledger   Appends one row to RUNS.md, committed as you.
#
# The prompts are in prompts/. The knobs are the env block below.

name: daily-profile-project

on:
  schedule:
    # 09:00 UTC daily. GitHub cron is UTC-only.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Work on this portfolio repo only, e.g. nano-vec (empty = normal rotation)"
        type: string
        default: ""
      dry_run:
        description: "Plan, build and verify, but publish nothing and skip the ledger"
        type: boolean
        default: false

# One lab operation at a time, across this workflow and reattribute-history.
concurrency:
  group: engineering-lab
  cancel-in-progress: false

# Nothing by default; each job asks for exactly what it needs.
permissions: {}

env:
  # The topic that defines the portfolio. The lab only touches repositories
  # that carry it. Changing it orphans every existing project.
  TOPIC: daily-gemini-project
  # Lab pull requests come from branches with this prefix and carry this label.
  BRANCH_PREFIX: lab/
  LABEL: daily-lab
  # At most this many lab PRs open at once across the portfolio (and never more
  # than one per repo). At the cap the lab only answers your comments, so
  # unreviewed work never piles up.
  MAX_OPEN_PRS: "3"
  # How many times the lab tries to fix failing checks on its own PR before it
  # leaves the PR to you.
  MAX_CI_FIX_ATTEMPTS: "2"
  # A repo with an open issue you filed moves this many days ahead in rotation.
  ISSUE_BOOST_DAYS: "7"
  # Hard cap on one change: added plus deleted lines, lockfiles excluded.
  MAX_CHANGED_LINES: "800"
  # Open PRs only in repos whose history lists nobody but you as a contributor
  # (run the reattribute-history workflow once first). "false" disables this.
  REQUIRE_CLEAN_HISTORY: "true"
  # Never wait for a password prompt that no one can answer.
  GIT_TERMINAL_PROMPT: "0"

jobs:
  # -------------------------------------------------------------------------
  # PLAN: deterministic. Holds the token; runs no model and no project code.
  # -------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      action: ${{ steps.plan.outputs.action }}
      reason: ${{ steps.plan.outputs.reason }}
      owner: ${{ steps.plan.outputs.owner }}
      git_name: ${{ steps.plan.outputs.git_name }}
      git_email: ${{ steps.plan.outputs.git_email }}
      can_edit_workflows: ${{ steps.plan.outputs.can_edit_workflows }}
      repo: ${{ steps.plan.outputs.repo }}
      repo_name: ${{ steps.plan.outputs.repo_name }}
      default_branch: ${{ steps.plan.outputs.default_branch }}
      owner_issues: ${{ steps.plan.outputs.owner_issues }}
      pr_number: ${{ steps.plan.outputs.pr_number }}
      pr_branch: ${{ steps.plan.outputs.pr_branch }}
      pr_title: ${{ steps.plan.outputs.pr_title }}
      pr_url: ${{ steps.plan.outputs.pr_url }}
      revise_kind: ${{ steps.plan.outputs.revise_kind }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Plan today's action
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
          FORCE_REPO: ${{ inputs.repo }}
          # Optional repository variables. By default commits use your
          # ID-based noreply address, which GitHub always links to you.
          COMMIT_NAME: ${{ vars.COMMIT_NAME }}
          COMMIT_EMAIL: ${{ vars.COMMIT_EMAIL }}
        run: python3 scripts/lab_state.py plan --runs RUNS.md --out "$RUNNER_TEMP/plan"

      - name: Hand the context to the work job
        if: steps.plan.outputs.action == 'improve' || steps.plan.outputs.action == 'revise'
        uses: actions/upload-artifact@v7
        with:
          name: plan
          path: ${{ runner.temp }}/plan/
          retention-days: 7

  # -------------------------------------------------------------------------
  # WORK: the model. No GitHub token exists on this machine.
  # -------------------------------------------------------------------------
  work:
    needs: plan
    if: needs.plan.outputs.action == 'improve' || needs.plan.outputs.action == 'revise'
    runs-on: ubuntu-latest
    # Real installs and test runs. Each model call has its own shorter timeout,
    # so a slow phase fails its step instead of cancelling the whole job.
    timeout-minutes: 80
    permissions:
      contents: read   # this repository, for prompts/ and scripts/
      id-token: write  # the OIDC token Google Cloud exchanges for Vertex AI credentials
    outputs:
      outcome: ${{ steps.commit.outputs.outcome || steps.audit.outputs.outcome }}
      title: ${{ steps.commit.outputs.title || steps.audit.outputs.title }}
      note: ${{ steps.audit.outputs.note }}
    env:
      ACTION: ${{ needs.plan.outputs.action }}
      OWNER: ${{ needs.plan.outputs.owner }}
      TARGET_REPO: ${{ needs.plan.outputs.repo }}
      DEFAULT_BRANCH: ${{ needs.plan.outputs.default_branch }}
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      PR_BRANCH: ${{ needs.plan.outputs.pr_branch }}
      PR_TITLE: ${{ needs.plan.outputs.pr_title }}
      CAN_EDIT_WORKFLOWS: ${{ needs.plan.outputs.can_edit_workflows }}
      # Every commit made in this job, including any the model makes on its
      # own, carries your identity: these variables override any git config.
      GIT_AUTHOR_NAME: ${{ needs.plan.outputs.git_name }}
      GIT_AUTHOR_EMAIL: ${{ needs.plan.outputs.git_email }}
      GIT_COMMITTER_NAME: ${{ needs.plan.outputs.git_name }}
      GIT_COMMITTER_EMAIL: ${{ needs.plan.outputs.git_email }}
      # Gemini on Vertex AI. `global` routes to the nearest capacity. `pro` is
      # the reasoning model; `flash` is cheaper and faster.
      GOOGLE_CLOUD_LOCATION: global
      GEMINI_MODEL: pro
      # The CLI refuses an untrusted folder, and there is no prompt-free way to
      # trust one. Safe here: the VM is ephemeral and holds no GitHub token.
      GEMINI_CLI_TRUST_WORKSPACE: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Toolchains the model needs to install dependencies and run tests.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install Gemini CLI
        run: npm install -g @google/gemini-cli

      # Short-lived Google credentials from the workflow's OIDC token; no key
      # is stored anywhere.
      - name: Authenticate to Google Cloud
        id: gcp-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # The CLI picks its auth backend from a settings file; without it the CLI
      # would prompt for one and hang until the job times out.
      - name: Point Gemini at Vertex AI
        env:
          PROJECT_ID: ${{ steps.gcp-auth.outputs.project_id }}
        run: |
          set -euo pipefail
          echo "GOOGLE_CLOUD_PROJECT=$PROJECT_ID" >> "$GITHUB_ENV"
          mkdir -p ~/.gemini
          echo '{"security":{"auth":{"selectedType":"vertex-ai"}}}' > ~/.gemini/settings.json

      - uses: actions/download-artifact@v8
        with:
          name: plan
          path: ${{ runner.temp }}/plan

      - name: Clone the target
        run: |
          set -euo pipefail
          OUT_DIR="$RUNNER_TEMP/out"
          WORKDIR="$RUNNER_TEMP/project"
          mkdir -p "$OUT_DIR"
          # Anonymous clone: the portfolio is public and this job has no token.
          if [ "$ACTION" = revise ]; then BRANCH="$PR_BRANCH"; else BRANCH="$DEFAULT_BRANCH"; fi
          git clone -q --branch "$BRANCH" "https://github.com/$TARGET_REPO.git" "$WORKDIR"
          git -C "$WORKDIR" checkout -q -b lab-change
          if [ "$CAN_EDIT_WORKFLOWS" = false ]; then
            CI_RULE="Do not create or modify anything under .github/workflows/: the token that publishes this change lacks the workflow scope, so such a change cannot be pushed."
          else
            CI_RULE="You may add or change GitHub Actions workflows under .github/workflows/; keep them minimal, with least-privilege permissions (contents: read), the same commands you ran locally, and no step that commits or pushes."
          fi
          {
            echo "OUT_DIR=$OUT_DIR"
            echo "WORKDIR=$WORKDIR"
            echo "BASE_SHA=$(git -C "$WORKDIR" rev-parse HEAD)"
            echo "CI_RULE=$CI_RULE"
          } >> "$GITHUB_ENV"

      # PHASE 1 (improve only): a read-only audit that picks one change.
      - name: Audit the repository (Gemini)
        id: audit
        if: env.ACTION == 'improve'
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          python3 "$GITHUB_WORKSPACE/scripts/lab_state.py" render \
            "$GITHUB_WORKSPACE/prompts/audit.md" "$OUT_DIR/audit-prompt.txt" \
            --env OWNER --env TARGET_REPO --env DEFAULT_BRANCH --env OUT_DIR --env CI_RULE \
            --env MAX_CHANGED_LINES --file CONTEXT "$RUNNER_TEMP/plan/context.md"
          # stream-json shows tool calls as they happen, so a hang is debuggable.
          # --include-directories lets the model write its file outside the clone.
          timeout 20m gemini -p "$(cat "$OUT_DIR/audit-prompt.txt")" \
            --approval-mode=yolo -m "$GEMINI_MODEL" --output-format stream-json \
            --include-directories "$OUT_DIR"

          D="$OUT_DIR/decision.json"
          if ! jq -e '(.action == "improve" or .action == "skip") and (.title | type == "string")' "$D" >/dev/null 2>&1; then
            echo "::error::the audit wrote no valid decision.json"
            exit 1
          fi
          jq . "$D"
          if [ "$(jq -r .action "$D")" = skip ]; then
            {
              echo "outcome=none"
              echo "title=audit found nothing worth a pull request"
              echo "note=$(jq -r '.rationale // ""' "$D" | tr -s '\r\n\t' ' ' | cut -c1-300)"
            } >> "$GITHUB_OUTPUT"
          fi
          # The audit may have installed or touched things. The build starts clean.
          git reset -q --hard "$BASE_SHA"
          git clean -qfdx || true

      # PHASE 2a: implement the audited plan.
      - name: Implement the change (Gemini)
        if: env.ACTION == 'improve' && steps.audit.outputs.outcome != 'none'
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          D="$OUT_DIR/decision.json"
          TITLE="$(jq -r '.title' "$D")"
          CATEGORY="$(jq -r '.category // ""' "$D")"
          EVIDENCE="$(jq -r '.evidence // ""' "$D")"
          PLAN="$(jq -r '.plan // ""' "$D")"
          export TITLE CATEGORY EVIDENCE PLAN
          python3 "$GITHUB_WORKSPACE/scripts/lab_state.py" render \
            "$GITHUB_WORKSPACE/prompts/improve.md" "$OUT_DIR/build-prompt.txt" \
            --env TARGET_REPO --env DEFAULT_BRANCH --env OUT_DIR --env CI_RULE --env MAX_CHANGED_LINES \
            --env TITLE --env CATEGORY --env EVIDENCE --env PLAN \
            --file CONTEXT "$RUNNER_TEMP/plan/context.md"
          timeout 40m gemini -p "$(cat "$OUT_DIR/build-prompt.txt")" \
            --approval-mode=yolo -m "$GEMINI_MODEL" --output-format stream-json \
            --include-directories "$OUT_DIR"

      # PHASE 2b: answer feedback or fix failing checks on an open lab PR.
      - name: Revise the pull request (Gemini)
        if: env.ACTION == 'revise'
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          python3 "$GITHUB_WORKSPACE/scripts/lab_state.py" render \
            "$GITHUB_WORKSPACE/prompts/revise.md" "$OUT_DIR/build-prompt.txt" \
            --env TARGET_REPO --env OUT_DIR --env CI_RULE --env MAX_CHANGED_LINES \
            --env PR_NUMBER --env PR_TITLE --file CONTEXT "$RUNNER_TEMP/plan/context.md"
          timeout 40m gemini -p "$(cat "$OUT_DIR/build-prompt.txt")" \
            --approval-mode=yolo -m "$GEMINI_MODEL" --output-format stream-json \
            --include-directories "$OUT_DIR"

      # PHASE 3: one commit, as you, verified by the workflow rather than by
      # the model's report. The publish job re-checks all of it.
      - name: Commit as the owner and re-run the tests
        id: commit
        # The audit step is skipped on revise runs; its outcome is then empty.
        if: steps.audit.outputs.outcome != 'none'
        run: |
          set -euo pipefail
          cd "$WORKDIR"
          R="$OUT_DIR/report.json"
          if ! jq -e 'type == "object"' "$R" >/dev/null 2>&1; then
            echo "::error::the model wrote no valid report.json"
            exit 1
          fi
          jq . "$R"

          # Whatever the model did with git (commits, branches), the change
          # becomes exactly one commit on BASE_SHA, made here.
          git symbolic-ref HEAD refs/heads/lab-change
          git reset -q --soft "$BASE_SHA"
          git add -A
          if git diff --cached --quiet; then
            if [ "$ACTION" = revise ] && [ -s "$OUT_DIR/reply.md" ]; then
              { echo "outcome=reply"; echo "title=replied on #$PR_NUMBER without a code change"; } >> "$GITHUB_OUTPUT"
            else
              { echo "outcome=none"; echo "title=the model produced no change"; } >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if [ "$(jq -r '.tests_passed' "$R")" != true ]; then
            echo "::error::the model reports that the tests did not pass; nothing will be published"
            exit 1
          fi
          TESTS_COMMAND="$(jq -r '.tests_command // ""' "$R")"
          if [ -z "$TESTS_COMMAND" ]; then
            echo "::error::report.json names no tests_command"
            exit 1
          fi

          if [ "$ACTION" = improve ]; then
            SUBJECT="$(jq -r '.title' "$OUT_DIR/decision.json")"
          else
            SUBJECT="$(jq -r '.commit_title // ""' "$R")"
            [ -n "$SUBJECT" ] || SUBJECT="Address review on #$PR_NUMBER"
          fi
          SUBJECT="$(printf '%s' "$SUBJECT" | tr -s '\r\n\t' ' ' | cut -c1-100)"
          # No co-author lines, @mentions or closing keywords ("fixes #3")
          # in the message: on the default branch those credit someone else,
          # notify strangers, or close issues.
          {
            printf '%s\n\n' "$SUBJECT"
            jq -r '.summary // ""' "$R" | fold -s -w 72
          } | python3 "$GITHUB_WORKSPACE/scripts/lab_state.py" sanitize > "$OUT_DIR/commit-msg.txt"
          SUBJECT="$(head -n 1 "$OUT_DIR/commit-msg.txt")"
          # Hooks off: nothing the model planted in .git/hooks gets to run.
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit -q --no-verify -F "$OUT_DIR/commit-msg.txt"
          git log -1 --format='%H%nauthor:    %an <%ae>%ncommitter: %cn <%ce>%n%n%B'

          # The model's "tests passed" is a claim; this is the check.
          set +e
          timeout 20m bash -c "$TESTS_COMMAND" > "$OUT_DIR/verify.log" 2>&1
          RC=$?
          set -e
          tail -n 60 "$OUT_DIR/verify.log"
          if [ "$RC" -ne 0 ]; then
            echo "::error::'$TESTS_COMMAND' failed on the committed change (exit $RC); nothing will be published"
            exit 1
          fi

          git bundle create -q "$OUT_DIR/change.bundle" "$BASE_SHA..lab-change"
          SLUG="$(jq -r '.slug // ""' "$OUT_DIR/decision.json" 2>/dev/null || true)"
          CLOSES="$(jq -c '.closes_issue // null | if type == "number" then . else null end' "$OUT_DIR/decision.json" 2>/dev/null || echo null)"
          jq -n --arg base "$BASE_SHA" --arg head "$(git rev-parse HEAD)" --arg title "$SUBJECT" \
            --arg slug "$SLUG" --arg tests "$TESTS_COMMAND" --argjson closes "$CLOSES" \
            '{base_sha: $base, head_sha: $head, title: $title, slug: $slug, tests_command: $tests, closes_issue: $closes}' \
            > "$OUT_DIR/meta.json"
          { echo "outcome=change"; echo "title=$SUBJECT"; } >> "$GITHUB_OUTPUT"

      - name: Hand the change to the publish job
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: work
          path: ${{ runner.temp }}/out/
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "## work: $ACTION $TARGET_REPO"
            for f in decision report; do
              if [ -f "$OUT_DIR/$f.json" ]; then
                echo; echo "### $f"; echo '```json'; jq . "$OUT_DIR/$f.json" || cat "$OUT_DIR/$f.json"; echo '```'
              fi
            done
            if [ -f "$OUT_DIR/verify.log" ]; then
              echo; echo "### the workflow's own test run (last 30 lines)"; echo '```text'
              tail -n 30 "$OUT_DIR/verify.log"; echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # -------------------------------------------------------------------------
  # PUBLISH: holds the token again; runs no model and no project code. The
  # only thing it takes from the work job is a commit, which it re-checks.
  # -------------------------------------------------------------------------
  publish:
    needs: [plan, work]
    if: >-
      needs.work.result == 'success'
      && (needs.work.outputs.outcome == 'change' || needs.work.outputs.outcome == 'reply')
      && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read  # this repository, for scripts/verify_change.sh at the workflow's own commit
    outputs:
      pr_url: ${{ steps.publish.outputs.pr_url }}
    env:
      GH_TOKEN: ${{ secrets.GH_PROFILE_TOKEN }}
      ACTION: ${{ needs.plan.outputs.action }}
      TARGET_REPO: ${{ needs.plan.outputs.repo }}
      REPO_NAME: ${{ needs.plan.outputs.repo_name }}
      DEFAULT_BRANCH: ${{ needs.plan.outputs.default_branch }}
      OWNER_ISSUES: ${{ needs.plan.outputs.owner_issues }}
      PR_NUMBER: ${{ needs.plan.outputs.pr_number }}
      PR_BRANCH: ${{ needs.plan.outputs.pr_branch }}
      PR_URL: ${{ needs.plan.outputs.pr_url }}
      REVISE_KIND: ${{ needs.plan.outputs.revise_kind }}
      EXPECT_NAME: ${{ needs.plan.outputs.git_name }}
      EXPECT_EMAIL: ${{ needs.plan.outputs.git_email }}
      ALLOW_WORKFLOW_EDITS: ${{ needs.plan.outputs.can_edit_workflows }}
      OUTCOME: ${{ needs.work.outputs.outcome }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: work
          path: ${{ runner.temp }}/work

      - name: Verify and publish
        id: publish
        run: |
          set -euo pipefail
          IN="$RUNNER_TEMP/work"
          # Everything the model wrote is posted under your account, so it goes
          # through the sanitizer first: no co-author lines (a squash merge
          # would credit them), no @mentions, no closing keywords.
          sanitize() { python3 "$GITHUB_WORKSPACE/scripts/lab_state.py" sanitize; }

          gh auth setup-git
          git clone -q "https://github.com/$TARGET_REPO.git" "$RUNNER_TEMP/target"
          cd "$RUNNER_TEMP/target"

          if [ "$OUTCOME" = change ]; then
            BASE="$(jq -r '.base_sha // ""' "$IN/meta.json")"
            if ! [[ "$BASE" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::meta.json names no valid base commit"
              exit 1
            fi
            git bundle verify -q "$IN/change.bundle"
            git fetch -q "$IN/change.bundle" "refs/heads/lab-change:refs/lab/change"
            NEW="$(git rev-parse refs/lab/change)"

            # The change must sit on what it claims, and that must be current.
            if [ "$ACTION" = improve ]; then
              if ! git merge-base --is-ancestor "$BASE" "origin/$DEFAULT_BRANCH"; then
                echo "::error::the change is not based on $DEFAULT_BRANCH"
                exit 1
              fi
            elif [ "$BASE" != "$(git rev-parse "origin/$PR_BRANCH")" ]; then
              echo "::error::$PR_BRANCH moved while the lab worked; the next run will look again"
              exit 1
            fi
            bash "$GITHUB_WORKSPACE/scripts/verify_change.sh" "$BASE" "$NEW" | tee "$RUNNER_TEMP/verify.out"
            CHANGED="$(sed -n 's/^changed_lines=//p' "$RUNNER_TEMP/verify.out")"
          fi

          if [ "$ACTION" = improve ]; then
            SLUG="$(jq -r '.slug // ""' "$IN/meta.json" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' \
              | sed 's/^-*//; s/-*$//' | cut -c1-40)"
            BRANCH="${BRANCH_PREFIX}$(date -u +%Y-%m-%d)-${SLUG:-change}"
            if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
              BRANCH="$BRANCH-$GITHUB_RUN_ID"
            fi
            git -c core.hooksPath=/dev/null push -q origin "$NEW:refs/heads/$BRANCH"

            TITLE="$(jq -r '.title // ""' "$IN/meta.json" | tr -d '\000-\037' | sanitize | cut -c1-100)"
            [ -n "$TITLE" ] || TITLE="Improve $REPO_NAME"
            TESTS="$(jq -r '.tests_command // ""' "$IN/meta.json" | tr -d '\000-\037`')"
            CLOSES="$(jq -r '.closes_issue // empty' "$IN/meta.json")"
            BODY="$RUNNER_TEMP/pr-body.md"
            {
              if [ -s "$IN/pr-body.md" ]; then
                sanitize < "$IN/pr-body.md" | head -c 40000
              else
                jq -r '.summary // ""' "$IN/report.json" | sanitize
              fi
              echo
              # Close an issue only if it is one you filed on this repository.
              if [[ "$CLOSES" =~ ^[0-9]+$ ]] && [[ " $OWNER_ISSUES " == *" $CLOSES "* ]]; then
                printf '\nCloses #%s\n' "$CLOSES"
              fi
              printf '\n---\n<details><summary>Checked by the workflow before this pull request was opened</summary>\n\n'
              # shellcheck disable=SC2016  # the backticks are Markdown, not command substitution
              printf -- '- `%s` re-run on this exact commit: passed\n' "$TESTS"
              printf -- '- one commit, authored and committed by %s, no co-author trailers\n' "$EXPECT_NAME"
              printf -- '- %s changed lines (lockfiles excluded); no build output, dependency directories, runtime data, credential shapes or submodules\n\n' "$CHANGED"
              printf '```text\n'
              tail -n 30 "$IN/verify.log" | tr '`' "'"
              printf '\n```\n</details>\n\n<sub>Opened by the daily engineering lab · [run log](%s)</sub>\n' "$RUN_URL"
            } > "$BODY"

            gh label create "$LABEL" -R "$TARGET_REPO" --color 1D76DB \
              --description "Opened by the daily engineering lab" --force >/dev/null
            URL="$(gh pr create -R "$TARGET_REPO" --base "$DEFAULT_BRANCH" --head "$BRANCH" \
              --title "$TITLE" --body-file "$BODY" --label "$LABEL" | tail -n 1)"
            echo "pr_url=$URL" >> "$GITHUB_OUTPUT"
            echo "opened $URL"
            exit 0
          fi

          # revise: fast-forward the PR branch (never force), then answer.
          if [ "$OUTCOME" = change ]; then
            git -c core.hooksPath=/dev/null push -q origin "$NEW:refs/heads/$PR_BRANCH"
          fi
          REPLY="$RUNNER_TEMP/reply.md"
          {
            # The marker is how the next run tells this reply from your feedback.
            printf '<!-- daily-lab kind=%s -->\n' "${REVISE_KIND:-feedback}"
            if [ -s "$IN/reply.md" ]; then
              sanitize < "$IN/reply.md" | head -c 20000
            else
              echo "Addressed in the commit below."
            fi
            printf '\n\n<sub>'
            if [ "$OUTCOME" = change ]; then
              printf 'Pushed %s; the workflow re-ran the tests on it: passed · ' "$(git rev-parse --short "$NEW")"
            fi
            printf '[run log](%s)</sub>\n' "$RUN_URL"
          } > "$REPLY"
          gh pr comment "$PR_NUMBER" -R "$TARGET_REPO" --body-file "$REPLY" >/dev/null
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "replied on $PR_URL"

  # -------------------------------------------------------------------------
  # LEDGER: one row per run, committed as you. It also keeps the schedule
  # alive: GitHub disables cron in a public repository after 60 days without
  # activity, and every other write goes to other repositories.
  # -------------------------------------------------------------------------
  ledger:
    needs: [plan, work, publish]
    if: always() && inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # RUNS.md in this repository
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      WORK_RESULT: ${{ needs.work.result }}
      PUBLISH_RESULT: ${{ needs.publish.result }}
      ACTION: ${{ needs.plan.outputs.action }}
      REASON: ${{ needs.plan.outputs.reason }}
      REPO_NAME: ${{ needs.plan.outputs.repo_name }}
      PLAN_PR_URL: ${{ needs.plan.outputs.pr_url }}
      OUTCOME: ${{ needs.work.outputs.outcome }}
      TITLE: ${{ needs.work.outputs.title }}
      NOTE: ${{ needs.work.outputs.note }}
      NEW_PR_URL: ${{ needs.publish.outputs.pr_url }}
      GIT_NAME: ${{ needs.plan.outputs.git_name }}
      GIT_EMAIL: ${{ needs.plan.outputs.git_email }}
    steps:
      - uses: actions/checkout@v7

      - name: Record the run in RUNS.md
        run: |
          set -euo pipefail
          cell() { printf '%s' "$1" | tr -s '\r\n\t' ' ' | sed 's/|/\\|/g' | cut -c1-200; }

          STATUS=success
          for result in "$PLAN_RESULT" "$WORK_RESULT" "$PUBLISH_RESULT"; do
            case "$result" in failure | cancelled) STATUS=failure ;; esac
          done

          if [ "$PLAN_RESULT" != success ]; then
            ROW_ACTION=-; REPO=-; CHANGE="plan job $PLAN_RESULT"
          elif [ "$ACTION" = skip ]; then
            ROW_ACTION=skip; REPO=-; CHANGE="$REASON"
          else
            ROW_ACTION="$ACTION"; REPO="$REPO_NAME"
            if [ "$WORK_RESULT" != success ]; then
              CHANGE="work job $WORK_RESULT"
            elif [ "$OUTCOME" = none ]; then
              ROW_ACTION=skip; CHANGE="${TITLE}${NOTE:+: $NOTE}"
            elif [ "$PUBLISH_RESULT" != success ]; then
              CHANGE="publish job $PUBLISH_RESULT: $TITLE"
            else
              CHANGE="$TITLE"
            fi
          fi
          PR=-
          URL="${NEW_PR_URL:-$PLAN_PR_URL}"
          if [ "$PUBLISH_RESULT" = success ] && [ -n "$URL" ]; then PR="[#${URL##*/}]($URL)"; fi

          ROW="$(printf '| %s | %s | %s | %s | %s | %s |' "$(date -u +%Y-%m-%d)" "$ROW_ACTION" \
            "$(cell "$REPO")" "$(cell "$CHANGE")" "$PR" "$STATUS")"
          echo "$ROW" >> RUNS.md
          { echo "## ledger"; echo; echo "$ROW"; } >> "$GITHUB_STEP_SUMMARY"

          # Without the plan job's identity there is no way to commit as you,
          # and committing as anyone else would put them in the contributor list.
          if [ -z "$GIT_NAME" ] || [ -z "$GIT_EMAIL" ]; then
            echo "::warning::no commit identity (the plan job failed), so RUNS.md is not committed"
            exit 0
          fi
          export GIT_AUTHOR_NAME="$GIT_NAME" GIT_AUTHOR_EMAIL="$GIT_EMAIL"
          export GIT_COMMITTER_NAME="$GIT_NAME" GIT_COMMITTER_EMAIL="$GIT_EMAIL"
          git add RUNS.md
          git commit -q -m "log: $(date -u +%Y-%m-%d) $ROW_ACTION"
          for attempt in 1 2 3; do
            if git push -q; then exit 0; fi
            echo "push attempt $attempt failed; rebasing onto the latest main"
            git pull -q --rebase
          done
          echo "::error::could not push RUNS.md"
          exit 1
